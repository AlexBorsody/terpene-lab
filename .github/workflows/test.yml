name: App and PWA checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/build-data.py --check
      - run: python3 scripts/build-pwa.py && git diff --exit-code -- index.html sw.js
      - run: node tests/master-data.cjs && node tests/research.cjs && node tests/catalog-consistency.cjs && node tests/research-audit.cjs && node tests/blend-engine.cjs && node tests/chemistry.cjs && node tests/research-labels-unit.cjs && node tests/pwa-updates.cjs && node tests/molecule-viewer.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          python3 -m http.server 8000 >/tmp/lab-server.log 2>&1 &
          browser_status=0
          for suite in pwa browser molecule-viewer-browser research-labels taxonomy-browser blend-browser blend-checkout; do
            node "tests/$suite.cjs" || browser_status=1
          done
          exit "$browser_status"
      - name: Preserve blend review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blend-builder-screenshots
          path: |
            /tmp/terpene-blend-*.png
            /tmp/terpene-molecule-*.png
          if-no-files-found: ignore
      - name: Export blend screenshots for review
        if: always()
        run: |
          python3 - <<'PYSCREEN'
          import base64, pathlib
          for image in sorted(pathlib.Path('/tmp').glob('terpene-blend-*.png')):
              print('BLEND_SCREENSHOT ' + image.name + ' ' + base64.b64encode(image.read_bytes()).decode())
          for image in sorted(pathlib.Path('/tmp').glob('terpene-molecule-*.png')):
              print('MOLECULE_SCREENSHOT ' + image.name + ' ' + base64.b64encode(image.read_bytes()).decode())
          PYSCREEN
