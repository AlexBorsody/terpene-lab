name: App and PWA checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/build-pwa.py && git diff --exit-code -- index.html sw.js
      - run: node tests/chemistry.cjs && node tests/research-labels-unit.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node tests/pwa.cjs
          python3 -m http.server 8000 >/tmp/lab-server.log 2>&1 &
          node tests/browser.cjs
          node tests/research-labels.cjs
